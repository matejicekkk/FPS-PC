<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPS-PC | Kategorie 10-15k</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
      color: #1e293b;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    header {
      background-color: #ffffff;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-fps {
      font-size: 24px;
      font-weight: 900;
      color: #1e293b;
      border: 3px solid #1e293b;
      padding: 2px 8px;
      text-transform: uppercase;
    }

    .logo-pc {
      font-size: 24px;
      font-weight: 900;
      color: #0066ff;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .btn-back {
      text-decoration: none;
      color: #0066ff;
      font-weight: 700;
      font-size: 15px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    .category-main-title {
      font-size: 28px;
      font-weight: 900;
      color: #0066ff;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .pc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .pc-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      border: 2px solid #e2e8f0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s, border-color 0.2s;
    }

    .pc-card:hover {
      transform: translateY(-5px);
      border-color: #0066ff;
    }

    .pc-card img {
      max-width: 100%;
      height: 160px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .pc-card h3 {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 15px;
    }

    .pc-price {
      font-size: 22px;
      font-weight: 900;
      color: #22c55e;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <span class="logo-fps">FPS</span>
      <span class="logo-pc">PC</span>
    </a>
    <a href="index.html" class="btn-back">← Zpět na úvod</a>
  </header>

  <div class="container">
    <h1 class="category-main-title">Sestavy 10 000 - 15 000 Kč</h1>

    <div class="pc-grid">
      <!-- Sestava 1 -->
      <a href="detail-pc2.html" class="pc-card">
        <img src="images.jpg" alt="Herní PC">
        <h3>Herní PC RTX 2060 | Ryzen 5 3600</h3>
        <div class="pc-price">10 990 Kč</div>
      </a>

      <!-- Sestava 2 -->
      <a href="detail-pc3.html" class="pc-card">
        <img src="images.jpg" alt="Herní PC">
        <h3>Herní PC RX 6600 | i3-12100F</h3>
        <div class="pc-price">13 990 Kč</div>
      </a>

      <!-- Sestava 3 -->
      <a href="detail-pc4.html" class="pc-card">
        <img src="images.jpg" alt="Herní PC">
        <h3>Herní PC RTX 3060 | Ryzen 5 5600</h3>
        <div class="pc-price">14 990 Kč</div>
      </a>
    </div>
  </div>

</body>
</html>
