<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS-PC | Kategorie 5-10k</title>
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; color: #1e293b; font-family: 'Segoe UI', Roboto, sans-serif; }
        header { background-color: #ffffff; padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-fps { font-size: 26px; font-weight: 900; color: #334155; border: 3px solid #334155; padding: 2px 8px; text-transform: uppercase; }
        .logo-pc { font-size: 26px; font-weight: 900; color: #0066ff; text-transform: uppercase; margin-left: 8px; }
        .btn-back { text-decoration: none; color: #0066ff; font-weight: 700; font-size: 16px; }
        
        .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
        h2 { font-size: 28px; text-align: center; margin-bottom: 40px; }
        h2 span { color: #0066ff; }

        .compare-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .pc-card {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            aspect-ratio: 1 / 1;
            text-decoration: none;
            color: inherit;
            box-sizing: border-box;
        }

        .pc-card.nvidia { border-color: #44bb00; }
        .pc-card.amd { border-color: #ff0000; }

        .pc-card.nvidia:hover { box-shadow: 0 10px 20px rgba(68, 187, 0, 0.15); transform: translateY(-3px); }
        .pc-card.amd:hover { box-shadow: 0 10px 20px rgba(255, 0, 0, 0.15); transform: translateY(-3px); }

        .pc-img { width: 100%; height: 75px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        .pc-img img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }

        .price { font-size: 15px; font-weight: 800; padding: 5px 10px; border-radius: 6px; white-space: nowrap; }
        .pc-card.nvidia .price { color: #44bb00; background-color: #f0fbf0; }
        .pc-card.amd .price { color: #ff0000; background-color: #fff5f5; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-fps">FPS</div>
            <div class="logo-pc">PC</div>
        </a>
        <a href="index.html" class="btn-back">← Zpět na úvod</a>
    </header>
    <div class="container">
        <h2>Sestavy <span>5 000 - 10 000 Kč</span></h2>
        <div class="compare-grid">
            <!-- PRVNÍ POČÍTAČ: Teď odkazuje na novou podstránku s detailem -->
            <a href="detail-pc1.html" class="pc-card nvidia">
                <div class="pc-img">
                    <img src="images.jpg" alt="Herní PC">
                </div>
                <span class="price">7 490 Kč</span>
            </a>

            <!-- Ostatní boxy bez fotek -->
            <a href="mailto:info@fpspc.cz?subject=Zájem o Sestavu 5-10k (NVIDIA 2)" class="pc-card nvidia">
                <div class="pc-img"></div>
                <span class="price">9 890 Kč</span>
            </a>
            <a href="mailto:info@fpspc.cz?subject=Zájem o Sestavu 5-10k (AMD 1)" class="pc-card amd">
                <div class="pc-img"></div>
                <span class="price">6 990 Kč</span>
            </a>
            <a href="mailto:info@fpspc.cz?subject=Zájem o Sestavu 5-10k (AMD 2)" class="pc-card amd">
                <div class="pc-img"></div>
                <span class="price">8 590 Kč</span>
            </a>
        </div>
    </div>
</body>
</html>
