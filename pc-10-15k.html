<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail sestavy - FPS Test</title>
  <style>
    /* ZÁKLADNÍ NASTAVENÍ STRÁNKY */
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1 {
      text-align: center;
      color: #0f172a;
      font-size: 28px;
      margin-bottom: 40px;
      text-transform: uppercase;
      font-weight: 900;
    }

    /* HLAVNÍ POSUVNÍK (SLIDER) */
    .slider-section {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 50px;
      text-align: center;
    }

    .slider-title {
      font-size: 18px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 15px;
    }

    #current-res-text {
      font-size: 24px;
      font-weight: 900;
      color: #0066ff;
      margin-top: 0;
      margin-bottom: 30px;
    }

    input[type="range"] {
      width: 100%;
      max-width: 600px;
      height: 8px;
      background: #cbd5e1;
      border-radius: 5px;
      outline: none;
      accent-color: #0066ff;
      cursor: pointer;
    }

    .slider-labels {
      display: flex;
      justify-content: space-between;
      max-width: 600px;
      margin: 15px auto 0 auto;
      font-weight: 700;
      color: #64748b;
      font-size: 14px;
    }

    /* KARTIČKY HER */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .game-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      transition: transform 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px rgba(0,0,0,0.05);
    }

    .game-card h3 {
      margin: 0 0 20px 0;
      font-size: 20px;
      color: #0f172a;
      font-weight: 800;
    }

    /* ŠTÍTKY (E-SPORT / AAA) */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .badge-esport { background: #dcfce7; color: #16a34a; }
    .badge-aaa { background: #fee2e2; color: #dc2626; }

    /* VÝSLEDNÉ FPS */
    .fps-result {
      background: #f0f7ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 15px;
    }

    .fps-number {
      font-size: 36px;
      font-weight: 900;
      color: #0066ff;
    }

    .fps-unit {
      font-size: 16px;
      font-weight: 700;
      color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Herní výkon této sestavy</h1>

    <!-- POSUVNÍK PRO VÝBĚR ROZLIŠENÍ -->
    <div class="slider-section">
      <div class="slider-title">Vyberte rozlišení vašeho monitoru:</div>
      <p id="current-res-text">Full HD (1080p)</p>
      
      <!-- Toto je ten hlavní posuvník (hodnoty 0, 1, 2) -->
      <input type="range" id="mainSlider" min="0" max="2" value="0" step="1">
      
      <div class="slider-labels">
        <span>FHD</span>
        <span>2K (1440p)</span>
        <span>4K</span>
      </div>
    </div>

    <!-- VÝPIS HER -->
    <div class="games-grid">
      
      <!-- Hra 1 -->
      <div class="game-card">
        <span class="badge badge-esport">E-sport</span>
        <h3>Fortnite</h3>
        <div class="fps-result">
          <span class="fps-number" id="fps-fortnite">280</span> <span class="fps-unit">FPS</span>
        </div>
      </div>

      <!-- Hra 2 -->
      <div class="game-card">
        <span class="badge badge-esport">E-sport</span>
        <h3>Counter-Strike 2</h3>
        <div class="fps-result">
          <span class="fps-number" id="fps-cs2">350</span> <span class="fps-unit">FPS</span>
        </div>
      </div>

      <!-- Hra 3 -->
      <div class="game-card">
        <span class="badge badge-esport">E-sport</span>
        <h3>Valorant</h3>
        <div class="fps-result">
          <span class="fps-number" id="fps-valorant">450</span> <span class="fps-unit">FPS</span>
        </div>
      </div>

      <!-- Hra 4 -->
      <div class="game-card">
        <span class="badge badge-aaa">AAA Hra</span>
        <h3>Cyberpunk 2077</h3>
        <div class="fps-result">
          <span class="fps-number" id="fps-cyberpunk">95</span> <span class="fps-unit">FPS</span>
        </div>
      </div>

      <!-- Hra 5 -->
      <div class="game-card">
        <span class="badge badge-aaa">AAA Hra</span>
        <h3>GTA V</h3>
        <div class="fps-result">
          <span class="fps-number" id="fps-gtav">165</span> <span class="fps-unit">FPS</span>
        </div>
      </div>

    </div>
  </div>

  <!-- PROGRAMOVACÍ ČÁST (SKRIPT), KTERÁ HÝBE S ČÍSly -->
  <script>
    // Zde jsou reálné FPS hodnoty: [Full HD, 2K, 4K]
    const fpsData = {
      fortnite: [280, 180, 90],
      cs2: [350, 240, 120],
      valorant: [450, 300, 160],
      cyberpunk: [95, 65, 40],
      gtav: [165, 115, 70]
    };

    // Texty, které se zobrazí nad posuvníkem
    const resolutionNames = ["Full HD (1080p)", "2K (1440p)", "4K (2160p)"];

    // Propojení s HTML elementy
    const slider = document.getElementById('mainSlider');
    const resText = document.getElementById('current-res-text');

    // Funkce, která se spustí při pohnutí posuvníkem
    slider.addEventListener('input', function() {
      // Zjistíme pozici posuvníku (0, 1 nebo 2)
      const pozice = parseInt(this.value);

      // 1. Změníme hlavní text rozlišení
      resText.innerText = resolutionNames[pozice];

      // 2. Přepíšeme FPS u všech her podle tabulky nahoře
      document.getElementById('fps-fortnite').innerText = fpsData.fortnite[pozice];
      document.getElementById('fps-cs2').innerText = fpsData.cs2[pozice];
      document.getElementById('fps-valorant').innerText = fpsData.valorant[pozice];
      document.getElementById('fps-cyberpunk').innerText = fpsData.cyberpunk[pozice];
      document.getElementById('fps-gtav').innerText = fpsData.gtav[pozice];
    });
  </script>

</body>
</html>
