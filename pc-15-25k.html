<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS-PC | Kategorie 15-25k</title>
    <style>
        body { margin: 0; padding: 0; background-color: #ffffff; color: #1e293b; font-family: 'Segoe UI', Roboto, sans-serif; }
        header { background-color: #ffffff; padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-fps { font-size: 26px; font-weight: 900; color: #334155; border: 3px solid #334155; padding: 2px 8px; text-transform: uppercase; }
        .logo-pc { font-size: 26px; font-weight: 900; color: #0066ff; text-transform: uppercase; margin-left: 8px; }
        .btn-back { text-decoration: none; color: #0066ff; font-weight: 700; font-size: 16px; }
        
        .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
        h2 { font-size: 28px; text-align: center; margin-bottom: 40px; }
        h2 span { color: #0066ff; }

        .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }

        /* KARTA JAKO KLIKACÍ TLAČÍTKO / ODKAZ */
        .pc-card {
            background-color: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            color: inherit;
            box-sizing: border-box;
            cursor: pointer; /* Zaručí ikonu ručičky při najetí */
            user-select: none;
        }

        /* NVIDIA vs AMD Barevné okraje */
        .pc-card.nvidia { border-color: #76b900; }
        .pc-card.amd { border-color: #ed1c24; }

        /* Efekt při najetí myší (Hover) */
        .pc-card.nvidia:hover { box-shadow: 0 10px 25px rgba(118, 185, 0, 0.2); transform: translateY(-4px); }
        .pc-card.amd:hover { box-shadow: 0 10px 25px rgba(237, 28, 36, 0.2); transform: translateY(-4px); }

        /* Efekt stisknutí (Active) - DÁVÁ POCIT ZMÁČKNUTÍ TLAČÍTKA */
        .pc-card:active {
            transform: scale(0.97) translateY(0);
        }

        .pc-img { width: 100%; height: 80px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
        .pc-img img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Cenovka */
        .price { font-size: 16px; font-weight: 800; padding: 6px 14px; border-radius: 8px; white-space: nowrap; margin-bottom: 12px; }
        .pc-card.nvidia .price { color: #16a34a; background-color: #f0fdf4; }
        .pc-card.amd .price { color: #dc2626; background-color: #fef2f2; }

        /* Akční tlačítko uvnitř karty */
        .card-btn {
            width: 100%;
            padding: 8px 0;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s ease;
        }

        .pc-card.nvidia .card-btn { background-color: #76b900; color: #ffffff; }
        .pc-card.nvidia:hover .card-btn { background-color: #659e00; }

        .pc-card.amd .card-btn { background-color: #ed1c24; color: #ffffff; }
        .pc-card.amd:hover .card-btn { background-color: #c9151c; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-fps">FPS</div>
            <div class="logo-pc">PC</div>
        </a>
        <a href="index.html" class="btn-back">← Zpět na úvod</a>
    </header>
    <div class="container">
        <h2>Sestavy <span>15 000 - 25 000 Kč</span></h2>
        <div class="compare-grid">
            
            <!-- Karta 1: NVIDIA -->
            <a href="detail-pc1.html" class="pc-card nvidia">
                <div class="pc-img">
                    <img src="https://via.placeholder.com/100" alt="PC NVIDIA">
                </div>
                <span class="price">18 500 Kč</span>
                
            </a>

            <!-- Karta 2: NVIDIA -->
            <a href="detail-pc2.html" class="pc-card nvidia">
                <div class="pc-img">
                    <img src="https://via.placeholder.com/100" alt="PC NVIDIA">
                </div>
                <span class="price">22 990 Kč</span>
                
            </a>

            <!-- Karta 3: AMD -->
            <a href="detail-pc3.html" class="pc-card amd">
                <div class="pc-img">
                    <img src="https://via.placeholder.com/100" alt="PC AMD">
                </div>
                <span class="price">16 990 Kč</span>
                
            </a>

            <!-- Karta 4: AMD -->
            <a href="detail-pc4.html" class="pc-card amd">
                <div class="pc-img">
                    <img src="https://via.placeholder.com/100" alt="PC AMD">
                </div>
                <span class="price">21 990 Kč</span>
              
            </a>

        </div>
    </div>
</body>
</html>
