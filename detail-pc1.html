<!DOCTYPE html>
<html lang="cs">
<body style="font-family: sans-serif; padding: 40px;">

  <h2>Fortnite FPS Test</h2>

  <!-- 1. POSUVNÍK ROZLIŠENÍ -->
  <div>
    <label>Rozlišení: <b id="res-lbl">FHD (1080p)</b></label><br>
    <input type="range" id="res-input" min="0" max="2" value="0" oninput="spocitejFPS()">
  </div>

  <br>

  <!-- 2. POSUVNÍK DETAILŮ -->
  <div>
    <label>Detaily: <b id="det-lbl">Low</b></label><br>
    <input type="range" id="det-input" min="0" max="3" value="0" oninput="spocitejFPS()">
  </div>

  <br>

  <!-- VÝSLEDNÉ FPS -->
  <h1 style="color: #0066ff;"><span id="fps-vysledek">240</span> FPS</h1>

  <script>
    const nazvyRozliseni = ["FHD (1080p)", "2K (1440p)", "4K (2160p)"];
    const nazvyDetailu = ["Low", "Medium", "High", "Ultra"];

    // Tabulka FPS: [Rozlišení][Detaily]
    const tabulkaFPS = [
      [240, 190, 140, 90],  // FHD: Low, Medium, High, Ultra
      [160, 120, 85, 60],   // 2K:  Low, Medium, High, Ultra
      [90, 65, 45, 30]      // 4K:  Low, Medium, High, Ultra
    ];

    function spocitejFPS() {
      const r = document.getElementById('res-input').value; // 0 = FHD, 1 = 2K, 2 = 4K
      const d = document.getElementById('det-input').value; // 0 = Low, 1 = Med, 2 = High, 3 = Ultra

      // Přepsání textu nad posuvníky
      document.getElementById('res-lbl').innerText = nazvyRozliseni[r];
      document.getElementById('det-lbl').innerText = nazvyDetailu[d];

      // Vytažení přesného čísla z tabulky
      document.getElementById('fps-vysledek').innerText = tabulkaFPS[r][d];
    }
  </script>

</body>
</html>
