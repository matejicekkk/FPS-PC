<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPS-PC | Kategorie 10-15k</title>
  <style>
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #1e293b;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    header {
      background-color: #ffffff;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-fps {
      font-size: 24px;
      font-weight: 900;
      color: #1e293b;
      border: 3px solid #1e293b;
      padding: 2px 8px;
      text-transform: uppercase;
    }

    .logo-pc {
      font-size: 24px;
      font-weight: 900;
      color: #0066ff;
      text-transform: uppercase;
      margin-left: 8px;
    }

    .btn-back {
      text-decoration: none;
      color: #0066ff;
      font-weight: 700;
      font-size: 15px;
    }

    .container {
      max-width: 1300px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    .category-main-title {
      font-size: 28px;
      font-weight: 900;
      color: #0066ff;
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .pc-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }

    .pc-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      width: 240px;
      height: 280px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .pc-card:hover {
      transform: translateY(-5px);
    }

    .pc-card.border-green {
      border: 2px solid #22c55e;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
    }

    .pc-card.border-red {
      border: 2px solid #ef4444;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.15);
    }

    .pc-card img {
      max-width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .pc-price-box {
      padding: 6px 16px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 900;
    }

    .pc-card.border-green .pc-price-box {
      color: #22c55e;
      background: #f0fdf4;
    }

    .pc-card.border-red .pc-price-box {
      color: #ef4444;
      background: #fef2f2;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-container">
      <span class="logo-fps">FPS</span>
      <span class="logo-pc">PC</span>
    </a>
    <a href="index.html" class="btn-back">← Zpět na úvod</a>
  </header>

  <div class="container">
    <h1 class="category-main-title">Sestavy 10 000 - 15 000 Kč</h1>

    <div class="pc-grid">
      <!-- Sestava 1 -->
      <a href="detail-pc1-10-15k.html" class="pc-card border-green">
        <img src="pc-1-10-15kjpg.jpg" alt="Herní PC">
        <div class="pc-price-box">13 990 Kč</div>
      </a>

      <!-- Sestava 2 -->
      <a href="detail-pc2-10-15k.html" class="pc-card border-red">
        <img src="images.jpg" alt="Herní PC">
        <div class="pc-price-box">12 490 Kč</div>
      </a>

      <!-- Sestava 3 -->
      <a href="detail-pc-10-15k.html" class="pc-card border-green">
        <img src="images.jpg" alt="Herní PC">
        <div class="pc-price-box">13 990 Kč</div>
      </a>

      <!-- Sestava 4 -->
      <a href="detail-pc4-10-15k.html" class="pc-card border-red">
        <img src="images.jpg" alt="Herní PC">
        <div class="pc-price-box">14 990 Kč</div>
      </a>
    </div>
  </div>

</body>
</html>
